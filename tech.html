<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DayFix – Smart solutions for everyday life.">
<meta name="theme-color" content="#10346f">
<title>DayFix</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#10346f;--navy-d:#0a2350;--navy-l:#1d4a97;--cream:#f5f3f0;--cream-d:#e4e0da;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins','Cairo',system-ui,sans-serif;background:var(--cream);color:var(--navy-d);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
[dir=rtl] body{font-family:'Cairo','Poppins',system-ui,sans-serif}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--navy-l);outline-offset:3px}
.wrap{width:min(1200px,92%);margin-inline:auto}
/* NAV */
header{position:sticky;top:0;z-index:50;background:var(--navy);box-shadow:0 2px 14px rgba(10,35,80,.35)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.logo{display:flex;align-items:center;gap:10px;color:var(--cream)}
.logo img{height:46px;width:46px;object-fit:cover;border-radius:10px}
.logo b{font-size:1.7rem;font-weight:800;display:inline-block;transform:rotate(-4deg);letter-spacing:-.5px;transition:transform .3s}
.logo:hover b{transform:rotate(2deg) scale(1.05)}
nav ul{display:flex;gap:6px;list-style:none;align-items:center}
nav a{color:var(--cream);padding:8px 16px;border-radius:999px;font-weight:500;font-size:.95rem;transition:background .25s,color .25s}
nav a:hover{background:rgba(245,243,240,.15)}
nav a.active{background:var(--cream);color:var(--navy)}
.lang{border:2px solid var(--cream);background:transparent;color:var(--cream);font:600 .9rem inherit;font-family:inherit;padding:6px 16px;border-radius:999px;cursor:pointer;transition:.25s}
.lang:hover{background:var(--cream);color:var(--navy)}
.burger{display:none;background:none;border:0;cursor:pointer;width:42px;height:42px;position:relative}
.burger span,.burger::before,.burger::after{content:"";position:absolute;inset-inline:9px;height:3px;border-radius:3px;background:var(--cream);transition:.3s}
.burger::before{top:12px}.burger span{top:19px}.burger::after{top:26px}
.burger.open::before{transform:translateY(7px) rotate(45deg)}.burger.open::after{transform:translateY(-7px) rotate(-45deg)}.burger.open span{opacity:0}
.right{display:flex;align-items:center;gap:10px}
/* HERO */
.hero{background:linear-gradient(135deg,var(--navy-d),var(--navy) 55%,var(--navy-l));background-size:200% 200%;animation:flow 14s ease infinite;color:var(--cream);text-align:center;padding:72px 0 88px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(245,243,240,.07);animation:float 9s ease-in-out infinite}
.hero::before{width:320px;height:320px;top:-120px;inset-inline-start:-80px}
.hero::after{width:220px;height:220px;bottom:-90px;inset-inline-end:6%;animation-delay:-4s}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;line-height:1.15;display:inline-block;transform:rotate(-2deg);animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
.hero p{max-width:720px;margin:22px auto 0;font-size:clamp(1rem,2.2vw,1.2rem);opacity:.92;animation:rise .9s .25s both}
.hero.small{padding:48px 0 56px}.hero.small h1{font-size:clamp(1.8rem,5vw,3rem)}
@keyframes flow{50%{background-position:100% 100%}}
@keyframes float{50%{transform:translateY(26px)}}
@keyframes pop{from{opacity:0;transform:rotate(-12deg) scale(.7)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
/* SECTIONS */
main{flex:1}
.sec{padding:56px 0 72px}
.sec h2{font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:700;text-align:center;margin-bottom:34px;color:var(--navy)}
.sec h2::after{content:"";display:block;width:70px;height:5px;border-radius:5px;background:var(--navy);margin:12px auto 0}
.tools{display:flex;justify-content:center;margin-bottom:34px}
.search{width:min(460px,100%);padding:13px 22px;border-radius:999px;border:2px solid var(--navy);background:#fff;font:inherit;color:var(--navy-d)}
.search:focus{outline:3px solid rgba(29,74,151,.35)}
/* CARDS */
.grid{display:grid;gap:26px}
.grid.big{grid-template-columns:repeat(2,1fr);gap:34px}
.grid.small{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 6px 22px rgba(16,52,111,.12);display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s;opacity:0;transform:translateY(30px)}
.card.in{opacity:1;transform:none}
.card:hover{transform:translateY(-8px);box-shadow:0 16px 36px rgba(16,52,111,.28)}
.pic{display:block;background:linear-gradient(135deg,var(--navy),var(--navy-l));overflow:hidden;aspect-ratio:4/3;position:relative}
.big .pic{aspect-ratio:16/10}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .pic img{transform:scale(1.08)}
.pic.noimg::after{content:"DayFix";position:absolute;inset:0;display:grid;place-items:center;color:var(--cream);font-weight:800;font-size:1.6rem;opacity:.5;transform:rotate(-4deg)}
.body{padding:20px 22px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:1.2rem;font-weight:700;color:var(--navy)}
.big .body h3{font-size:1.5rem}
.body p{font-size:.95rem;color:#3a4a6b}
.more{margin-top:auto;padding-top:10px;font-weight:600;color:var(--navy);display:inline-flex;gap:6px;align-items:center}
.more svg{width:18px;height:18px;transition:transform .25s}
.card:hover .more svg{transform:translateX(5px)}
[dir=rtl] .more svg{transform:scaleX(-1)}[dir=rtl] .card:hover .more svg{transform:scaleX(-1) translateX(5px)}
.empty{text-align:center;color:var(--navy);display:none;font-weight:600}
/* FOOTER */
footer{background:var(--navy);color:var(--cream);text-align:center;padding:38px 0 26px}
.soc{display:flex;gap:14px;justify-content:center;margin-bottom:16px}
.soc a{width:48px;height:48px;border-radius:50%;border:2px solid var(--cream);display:grid;place-items:center;transition:.3s}
.soc a:hover{background:var(--cream);color:var(--navy);transform:translateY(-5px) rotate(-8deg)}
.soc svg{width:22px;height:22px;fill:currentColor}.soc svg.st{fill:none;stroke:currentColor;stroke-width:2}
footer small{opacity:.75}
.top{position:fixed;bottom:22px;inset-inline-end:22px;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:var(--cream);font-size:1.3rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.top.show{opacity:1;pointer-events:auto}
/* RESPONSIVE */
@media(max-width:1000px){.grid.small{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
 .burger{display:block}
 nav{position:absolute;top:72px;inset-inline:0;background:var(--navy-d);max-height:0;overflow:hidden;transition:max-height .4s}
 nav.open{max-height:420px}
 nav ul{flex-direction:column;padding:14px 0 20px;align-items:stretch;width:min(92%,600px);margin-inline:auto}
 nav a{display:block;text-align:center}
 .grid.big{grid-template-columns:1fr}
}
@media(max-width:380px){.grid.small{grid-template-columns:1fr}}
@media(max-width:560px){.grid.small{gap:14px}.body{padding:14px 14px 18px}.body h3{font-size:1rem}.body p{font-size:.85rem}.grid.big{gap:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<script>
/* ===== SITE SETTINGS (edit here, same in all 5 files) ===== */
const SITE={
  social:{facebook:"https://facebook.com/",instagram:"https://instagram.com/",whatsapp:"https://wa.me/0000000000"},
  nav:[
    {href:"index.html",en:"Home",ar:"الرئيسية"},
    {href:"page1.html",en:"Page One",ar:"الصفحة الأولى"},
    {href:"page2.html",en:"Page Two",ar:"الصفحة الثانية"},
    {href:"page3.html",en:"Page Three",ar:"الصفحة الثالثة"},
    {href:"page4.html",en:"Page Four",ar:"الصفحة الرابعة"}
  ]
};
const I18N={
 en:{brand:"DayFix",tagline:"Easy hacks for easier life",brief_t:"DayFix – Smart Solutions for Everyday Life",
  brief:"Discover smart products that solve everyday problems, make life easier, and bring real value to your day. We share useful products that make a difference, because every problem deserves a smart solution!",
  discover:"Discover What You Need",search:"Search...",none:"No results found.",view:"View",follow:"Follow us",rights:"All rights reserved.",top:"Back to top",menu:"Menu"},
 ar:{brand:"DayFix",tagline:"حيل بسيطة لحياة أسهل",brief_t:"DayFix – حلول ذكية لحياتك اليومية",
  brief:"اكتشف منتجات ذكية تحل مشكلات الحياة اليومية، وتجعل حياتك أسهل، وتضيف قيمة حقيقية ليومك. نشارك معك منتجات مفيدة تصنع الفرق، لأن كل مشكلة تستحق حلاً ذكياً!",
  discover:"اكتشف ما تحتاجه",search:"ابحث...",none:"لا توجد نتائج.",view:"عرض",follow:"تابعنا",rights:"جميع الحقوق محفوظة.",top:"للأعلى",menu:"القائمة"}
};
/* ===== PAGE DATA ===== */
const PAGE={
  "id": "tech.html",
  "type": "list",
  "title": {
    "en": "Page Two",
    "ar": "الصفحة الثانية"
  },
  "cards": [
    {
      "name_en": "Card 1",
      "name_ar": "البطاقة 1",
      "text_en": "English paragraph for card_1. Replace this text with your own.",
      "text_ar": "فقرة عربية للبطاقة card_1. استبدل هذا النص بنصك.",
      "img": "images/page2_card_1.jpg",
      "link": "#"
    },
    {
      "name_en": "Card 2",
      "name_ar": "البطاقة 2",
      "text_en": "English paragraph for card_2. Replace this text with your own.",
      "text_ar": "فقرة عربية للبطاقة card_2. استبدل هذا النص بنصك.",
      "img": "images/page2_card_2.jpg",
      "link": "#"
    }
  ]
};
/* ===== ENGINE ===== */
let lang="en";try{lang=localStorage.getItem("dayfix_lang")||"en"}catch(e){}
const $=s=>document.querySelector(s),t=k=>I18N[lang][k]||k;
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const ICONS={
 facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>',
 instagram:'<svg class="st" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
 whatsapp:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>'
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function layout(){
 document.body.insertAdjacentHTML("afterbegin",`
 <header><div class="wrap bar">
  <a class="logo" href="index.html" aria-label="DayFix"><img src="images/logo.png" alt="DayFix logo" onerror="this.remove()"><b>DayFix</b></a>
  <div class="right"><nav id="nav" aria-label="Main"><ul id="links"></ul></nav>
  <button class="lang" id="langBtn" type="button"></button>
  <button class="burger" id="burger" type="button" aria-label="Menu"><span></span></button></div>
 </div></header>`);
 const hero=PAGE.type==="home"?`<section class="hero"><div class="wrap"><h1 id="hT"></h1><p id="hP"></p></div></section>`:
  `<section class="hero small"><div class="wrap"><h1 id="hT"></h1></div></section>`;
 const search=PAGE.type==="home"?"":`<div class="tools"><input class="search" id="q" type="search" autocomplete="off"></div>`;
 const grid=PAGE.type==="home"?"big":"small";
 $("header").insertAdjacentHTML("afterend",`<main>${hero}<section class="sec"><div class="wrap">
  ${PAGE.type==="home"?'<h2 id="h2"></h2>':''}${search}<div class="grid ${grid}" id="grid"></div><p class="empty" id="empty"></p></div></section></main>
  <footer><div class="wrap"><div class="soc">${["facebook","instagram","whatsapp"].map(k=>`<a href="${SITE.social[k]}" target="_blank" rel="noopener" aria-label="${k}">${ICONS[k]}</a>`).join("")}</div>
  <small>© ${new Date().getFullYear()} DayFix · <span id="rights"></span></small></div></footer><button class="top" id="top" type="button">↑</button>`);
}
function cards(){
 const q=PAGE.type==="home"?"":($("#q").value||"").trim().toLowerCase();
 const list=PAGE.cards.filter(c=>!q||(c["name_"+lang]+" "+c["text_"+lang]).toLowerCase().includes(q));
 $("#grid").innerHTML=list.map(c=>`<article class="card"><a class="pic noimg" href="${esc(c.link)}"><img src="${esc(c.img)}" alt="${esc(c["name_"+lang])}" loading="lazy" onload="this.parentNode.classList.remove('noimg')" onerror="this.remove()"></a>
  <div class="body"><h3><a href="${esc(c.link)}">${esc(c["name_"+lang])}</a></h3><p>${esc(c["text_"+lang])}</p><a class="more" href="${esc(c.link)}">${t("view")} ${ARROW}</a></div></article>`).join("");
 $("#empty").style.display=list.length?"none":"block";$("#empty").textContent=t("none");
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll(".card").forEach((c,i)=>{c.style.transitionDelay=(i%4)*90+"ms";io.observe(c)});
}
function apply(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("#links").innerHTML=SITE.nav.map(n=>`<li><a href="${n.href}" class="${n.href===PAGE.id?"active":""}">${n[lang]}</a></li>`).join("");
 $("#langBtn").textContent=lang==="en"?"العربية":"English";
 $("#hT").textContent=PAGE.type==="home"?t("brief_t"):PAGE.title[lang];
 if(PAGE.type==="home"){$("#hP").textContent=t("brief");$("#h2").textContent=t("discover")}else{$("#q").placeholder=t("search")}
 $("#rights").textContent=t("rights");$("#top").title=t("top");
 document.title="DayFix – "+(PAGE.type==="home"?t("tagline"):PAGE.title[lang]);
 cards();
}
layout();
$("#langBtn").onclick=()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("dayfix_lang",lang)}catch(e){}apply()};
$("#burger").onclick=e=>{e.currentTarget.classList.toggle("open");$("#nav").classList.toggle("open")};
if($("#q"))$("#q").oninput=cards;
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>$("#top").classList.toggle("show",scrollY>400),{passive:true});
apply();
</script>
</body>
</html>
